<section class="section section-white" id="calendly">
    <div class="container">
        <div class="reveal" style="text-align:center; max-width:640px; margin:0 auto;">
            <h2>{{CALENDLY_TITLE}}</h2>
            <p>{{CALENDLY_LEAD}}</p>
        </div>
        <div class="calendly-wrapper">
            <!-- Calendly inline widget begin -->
            <div class="calendly-inline-widget"
                 data-url="https://calendly.com/{{CALENDLY_ACCOUNT}}/{{CALENDLY_EVENT}}?background_color=ffffff&text_color=1d1d1f&primary_color={{PRIMARY_HEX_NO_HASH}}"
                 style="min-width:320px;height:700px;"></div>
            <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
            <!-- Calendly inline widget end -->
        </div>
    </div>
</section>

<section class="section section-gray">
    <div class="container">
        <div class="testimonial reveal">
            <div class="testimonial-stars" aria-label="5 out of 5 stars">★★★★★</div>
            <p class="testimonial-quote">&ldquo;{{TESTIMONIAL_QUOTE}}&rdquo;</p>
            <div class="testimonial-author">
                <span class="testimonial-avatar">{{TESTIMONIAL_INITIALS}}</span>
                <div style="text-align:left;">
                    <div style="font-weight:600;">{{TESTIMONIAL_NAME}}</div>
                    <div style="color:var(--text-secondary); font-size:0.9rem;">{{TESTIMONIAL_ROLE}} &middot; {{TESTIMONIAL_COMPANY}}</div>
                </div>
            </div>
        </div>
    </div>
</section>

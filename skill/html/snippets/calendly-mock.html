<section class="section section-white" id="calendly">
    <div class="container">
        <div class="reveal" style="text-align:center; max-width:640px; margin:0 auto;">
            <h2>{{CALENDLY_TITLE}}</h2>
            <p>{{CALENDLY_LEAD}}</p>
        </div>
        <div class="calendly-wrapper" style="background:var(--bg-white); padding:40px; text-align:center;">
            <div style="display:inline-flex; flex-direction:column; gap:16px; align-items:center;">
                <div style="width:72px; height:72px; border-radius:20px; background:var(--primary-light); color:var(--primary); display:inline-flex; align-items:center; justify-content:center; font-size:2rem;">
                    <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
                </div>
                <h3 style="margin:0;">Book a call</h3>
                <p style="max-width:380px;">The booking widget goes here. Connect a Calendly account to embed it live.</p>

            </div>
        </div>
    </div>

<section class="section section-white hero">
    <div class="container hero-grid">
        <div class="hero-content reveal">
            <div class="hero-badge">
                <i class="fa-solid {{HERO_BADGE_ICON}}" aria-hidden="true"></i>
                <span>{{HERO_BADGE_TEXT}}</span>
            </div>
            <h1>{{HERO_HEADLINE}}</h1>
            <p class="hero-subheadline">{{HERO_SUBHEADLINE}}</p>
            <div class="hero-ctas">
                <a href="#calendly" class="btn btn-primary">{{HERO_PRIMARY_CTA}}</a>
                <a href="#how-it-works" class="btn btn-secondary">{{HERO_SECONDARY_CTA}}</a>
            </div>
            <div class="hero-trust">
                <span><i class="fa-solid fa-circle-check" aria-hidden="true"></i> {{HERO_TRUST_1}}</span>
                <span><i class="fa-solid fa-circle-check" aria-hidden="true"></i> {{HERO_TRUST_2}}</span>
                <span><i class="fa-solid fa-circle-check" aria-hidden="true"></i> {{HERO_TRUST_3}}</span>
            </div>
        </div>
        <div class="illustration-placeholder floating" aria-hidden="true">
            <i class="fa-solid {{HERO_ILLUSTRATION_ICON}}"></i>
            <span>{{BRAND_NAME}}</span>
        </div>
    </div>
</section>

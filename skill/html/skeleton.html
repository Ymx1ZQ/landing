<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}">
    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{OG_URL}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{OG_TITLE}}">
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','{{GTM_ID}}');</script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root {
            --primary:        {{PRIMARY_HEX}};
            --primary-dark:   {{PRIMARY_DARK_HEX}};
            --primary-light:  #E8F4FD;
            --text-primary:   #1D1D1F;
            --text-secondary: #6E6E73;
            --bg-white:  #FFFFFF;
            --bg-gray:   #F5F5F7;
            --bg-dark:   #1D1D1F;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-primary);
            background: var(--bg-white);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        img { max-width: 100%; display: block; }
        a { color: inherit; text-decoration: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        /* Section alternation */
        .section         { padding: 96px 0; }
        .section-white   { background: var(--bg-white); }
        .section-gray    { background: var(--bg-gray); }
        .section-dark    { background: var(--bg-dark); }
        .section-dark h1,
        .section-dark h2,
        .section-dark h3 { color: #FFFFFF; }
        .section-dark p,
        .section-dark li,
        .section-dark span { color: rgba(255,255,255,0.6); }
        .section-dark small,
        .section-dark caption { color: rgba(255,255,255,0.35); }

        h1 { font-size: clamp(2.8rem, 6vw, 4.5rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; }
        h2 { font-size: clamp(2rem, 4vw, 3rem);      font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 24px; }
        h3 { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 12px; }
        p  { font-size: 1.05rem; color: var(--text-secondary); }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px; border-radius: 999px;
            font-size: 1rem; font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            cursor: pointer; border: none;
        }
        .btn-primary    { background: var(--primary); color: #fff; }
        .btn-primary:hover    { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .btn-secondary  { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn-secondary:hover  { background: var(--primary-light); }
        .btn-white      { background: #fff; color: var(--primary); }
        .btn-white:hover      { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,255,255,0.12); }
        .btn-sm         { padding: 10px 20px; font-size: 0.9rem; }

        /* Nav */
        .nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid transparent;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .nav.scrolled { box-shadow: 0 1px 0 rgba(0,0,0,0.06); border-bottom-color: rgba(0,0,0,0.05); }
        .nav-container {
            max-width: 1200px; margin: 0 auto; padding: 14px 24px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; }
        .nav-brand i { color: var(--primary); }

        /* Hero */
        .hero { padding: 80px 0 96px; }
        .hero-grid {
            display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: center;
        }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 14px; border-radius: 999px;
            background: var(--primary-light); color: var(--primary);
            font-size: 0.85rem; font-weight: 600;
            margin-bottom: 24px;
        }
        .hero-subheadline { margin-top: 20px; font-size: 1.2rem; color: var(--text-secondary); max-width: 520px; }
        .hero-ctas { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
        .hero-trust {
            display: flex; gap: 20px; margin-top: 28px; flex-wrap: wrap;
            font-size: 0.9rem; color: var(--text-secondary);
        }
        .hero-trust span { display: inline-flex; align-items: center; gap: 6px; }
        .hero-trust i { color: var(--primary); }

        /* Illustration placeholder */
        .illustration-placeholder {
            width: 100%; max-width: 480px; aspect-ratio: 4 / 3;
            background: linear-gradient(135deg, #EBF4FF 0%, #DBEAFE 55%, #EDE9FE 100%);
            border-radius: 24px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; color: var(--primary); margin: 0 auto;
        }
        .illustration-placeholder i    { font-size: 3.5rem; opacity: 0.5; }
        .illustration-placeholder span { font-size: 0.9rem; font-weight: 600; opacity: 0.6; }

        /* Problem */
        .problem-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 48px; align-items: center; }
        .pain-list { list-style: none; margin-top: 24px; }
        .pain-list li { display: flex; gap: 12px; padding: 12px 0; font-size: 1.05rem; color: var(--text-secondary); }
        .pain-list i { color: #DC2626; margin-top: 4px; }

        /* Features */
        .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-top: 48px; }
        .feature-card {
            padding: 32px; border-radius: 20px; background: var(--bg-gray);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .feature-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.06); }
        .feature-icon {
            width: 52px; height: 52px; border-radius: 14px;
            background: var(--primary-light); color: var(--primary);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.4rem; margin-bottom: 20px;
            transition: background 0.25s ease, color 0.25s ease;
        }
        .feature-card:hover .feature-icon { background: var(--primary); color: #fff; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px; text-align: center; }
        .stat-value {
            font-size: clamp(2.8rem, 5vw, 4rem); font-weight: 700; letter-spacing: -0.03em;
            background: linear-gradient(135deg, #60A5FA, #A78BFA);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .stat-label { margin-top: 12px; color: rgba(255,255,255,0.5); font-size: 0.95rem; }

        /* Testimonial */
        .testimonial {
            max-width: 760px; margin: 0 auto; text-align: center; position: relative;
        }
        .testimonial::before {
            content: '"'; position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
            font-size: 6rem; color: rgba(0,113,227,0.15); font-family: Georgia, serif;
        }
        .testimonial-stars { color: #F59E0B; margin-bottom: 16px; font-size: 1.1rem; }
        .testimonial-quote { font-size: 1.4rem; font-weight: 500; line-height: 1.5; color: var(--text-primary); }
        .testimonial-author { margin-top: 24px; display: inline-flex; align-items: center; gap: 12px; }
        .testimonial-avatar {
            width: 48px; height: 48px; border-radius: 999px;
            background: linear-gradient(135deg, var(--primary), #A78BFA);
            color: #fff; display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700;
        }

        /* Integration */
        .integration-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
        .integration-list { list-style: none; }
        .integration-list li { padding: 10px 0; display: flex; gap: 10px; color: var(--text-secondary); }
        .integration-list i { color: var(--primary); }

        /* FAQ */
        .faq-list { max-width: 760px; margin: 0 auto; }
        .faq-item { border-bottom: 1px solid rgba(0,0,0,0.08); }
        .faq-item summary {
            padding: 20px 0; font-size: 1.1rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
            list-style: none;
        }
        .faq-item summary::-webkit-details-marker { display: none; }
        .faq-item summary i { transition: transform 0.25s ease; color: var(--primary); }
        .faq-item[open] summary i { transform: rotate(180deg); }
        .faq-item .faq-a { padding: 0 0 20px; color: var(--text-secondary); }

        /* Calendly wrapper */
        .calendly-wrapper { max-width: 860px; margin: 48px auto 0; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.06); background: #fff; position: relative; }
        .calendly-placeholder {
            min-height: 360px; padding: 56px 32px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 16px;
            background: linear-gradient(180deg, #fff, #fafafb);
        }
        .calendly-placeholder h3 { color: var(--text-primary); font-size: 1.2rem; }
        .calendly-placeholder p  { color: var(--text-secondary); max-width: 420px; }
        .calendly-fallback {
            text-align: center; margin-top: 24px;
            color: var(--text-secondary); font-size: 0.92rem;
        }
        .calendly-fallback a { color: var(--primary); font-weight: 600; }
        .calendly-fallback a:hover { text-decoration: underline; }

        /* Disabled / placeholder links (footer Privacy/Terms when URL not provided) */
        .disabled-link {
            color: rgba(255,255,255,0.35); cursor: not-allowed;
            pointer-events: none;
        }

        /* Cookie consent banner (M15) */
        .cookie-banner {
            position: fixed; left: 16px; right: 16px; bottom: 16px;
            max-width: 720px; margin: 0 auto;
            background: #1D1D1F; color: #fff;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.30);
            padding: 18px 22px;
            display: none;
            z-index: 200;
            font-size: 0.9rem; line-height: 1.5;
        }
        .cookie-banner.show { display: block; }
        .cookie-banner-body { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
        .cookie-banner-text { flex: 1; min-width: 240px; color: rgba(255,255,255,0.85); }
        .cookie-banner-text strong { color: #fff; }
        .cookie-banner-actions { display: flex; gap: 10px; flex-shrink: 0; }
        .cookie-btn {
            padding: 9px 18px; border-radius: 999px;
            border: none; cursor: pointer;
            font-size: 0.85rem; font-weight: 600;
            transition: transform 0.2s ease;
        }
        .cookie-btn:hover { transform: translateY(-1px); }
        .cookie-btn-accept  { background: var(--primary); color: #fff; }
        .cookie-btn-reject  { background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.85); }
        @media (max-width: 768px) {
            .cookie-banner-actions { width: 100%; }
            .cookie-btn { flex: 1; }
        }

        /* Final CTA */
        .final-cta {
            padding: 120px 0;
            background: radial-gradient(ellipse at center, rgba(0,113,227,0.22) 0%, #1D1D1F 65%);
            text-align: center;
        }
        .final-cta h2 { color: #fff; }
        .final-cta p  { color: rgba(255,255,255,0.65); max-width: 520px; margin: 20px auto 0; }
        .final-cta .btn-lg { padding: 18px 36px; font-size: 1.1rem; margin-top: 32px; }
        .final-cta .microcopy { color: rgba(255,255,255,0.35); margin-top: 20px; font-size: 0.85rem; }

        /* Footer */
        .footer {
            background: var(--bg-dark); color: rgba(255,255,255,0.5);
            padding: 48px 0; border-top: 1px solid rgba(255,255,255,0.08);
        }
        .footer-grid { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .footer-brand { color: #fff; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; }
        .footer-brand i { color: var(--primary); }
        .footer-links { display: flex; gap: 20px; font-size: 0.9rem; }

        /* Reveal animation */
        .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .reveal.in-view { opacity: 1; transform: translateY(0); }

        /* Floating illustration */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-14px); }
        }
        .floating { animation: float 6s ease-in-out infinite; }

        /* Responsive */
        @media (max-width: 768px) {
            .section { padding: 64px 0; }
            .hero-grid, .problem-grid, .integration-grid { grid-template-columns: 1fr; gap: 32px; }
            .features-grid { grid-template-columns: 1fr; }
            .stats-grid    { grid-template-columns: 1fr; gap: 32px; }
            .hero { padding: 48px 0 64px; }
            .final-cta { padding: 80px 0; }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .reveal { opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
{{#GTM_BODY}}

height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
{{/GTM_BODY}}

{{SECTIONS}}

<script>
    // Nav scroll class
    (function() {
        const nav = document.querySelector('.nav');
        if (!nav) return;
        const onScroll = () => {
            if (window.scrollY > 4) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
    })();

    // Reveal on scroll
    (function() {
        if (!('IntersectionObserver' in window)) {
            document.querySelectorAll('.reveal').forEach(el => el.classList.add('in-view'));
            return;
        }
        const io = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    e.target.classList.add('in-view');
                    io.unobserve(e.target);
                }
            });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
        document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    })();

    // Counter animation (stats)
    (function() {
        const counters = document.querySelectorAll('[data-target]');
        if (!counters.length) return;
        const animate = (el) => {
            const target  = parseFloat(el.dataset.target);
            const suffix  = el.dataset.suffix || '';
            const prefix  = el.dataset.prefix || '';
            const duration = 1400;
            const start = performance.now();
            const step = (now) => {
                const p = Math.min(1, (now - start) / duration);
                const eased = 1 - Math.pow(1 - p, 3);
                const val = Math.round(target * eased * 10) / 10;
                const display = Number.isInteger(target) ? Math.round(val) : val;
                el.textContent = prefix + display + suffix;
                if (p < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        };
        const io = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                if (e.isIntersecting) { animate(e.target); io.unobserve(e.target); }
            });
        }, { threshold: 0.4 });
        counters.forEach(el => io.observe(el));
    })();

    // Cookie consent controller (M15) — gates third-party embeds (Calendly etc.).
    // No-op when no .cookie-banner is present (i.e., the cookie-banner snippet wasn't included).
    (function() {
        const KEY = 'landing_cookie_consent_v1';
        const banner = document.getElementById('cookie-banner');
        if (!banner) return; // banner not included for this page; nothing to do

        const acceptBtn = document.getElementById('cookie-accept');
        const rejectBtn = document.getElementById('cookie-reject');
        const placeholder = document.getElementById('calendly-placeholder');
        const slot = document.getElementById('calendly-slot');

        // loadThirdPartyEmbeds() — called when the user accepts.
        // The /landing html stage fills CONVERSION_EMBED with either:
        //   (a) the verbatim Calendly inline-widget block (banner OFF), or
        //   (b) a placeholder + <div id="calendly-slot"></div> (banner ON).
        // This function handles case (b): inject the widget + script into the slot.
        function loadThirdPartyEmbeds() {
            if (!slot || slot.dataset.loaded === '1') return;
            const tpl = slot.getAttribute('data-embed-url');
            if (!tpl) return;
            slot.dataset.loaded = '1';
            const widget = document.createElement('div');
            widget.className = 'calendly-inline-widget';
            widget.setAttribute('data-url', tpl);
            widget.setAttribute('style', 'min-width:320px;height:700px;');
            slot.appendChild(widget);
            const script = document.createElement('script');
            script.src = 'https://assets.calendly.com/assets/external/widget.js';
            script.async = true;
            document.body.appendChild(script);
            if (placeholder) placeholder.style.display = 'none';
        }

        const consent = localStorage.getItem(KEY);
        if (consent === 'accepted')      { loadThirdPartyEmbeds(); banner.classList.remove('show'); }
        else if (consent === 'rejected') { banner.classList.remove('show'); }
        else                              { banner.classList.add('show'); }

        if (acceptBtn) acceptBtn.addEventListener('click', () => {
            localStorage.setItem(KEY, 'accepted');
            loadThirdPartyEmbeds();
            banner.classList.remove('show');
        });
        if (rejectBtn) rejectBtn.addEventListener('click', () => {
            localStorage.setItem(KEY, 'rejected');
            banner.classList.remove('show');
        });
    })();
</script>

</body>
